buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")

        // Add the dependency for the Google services Gradle plugin
        classpath("com.google.gms:google-services:4.5.0")
    }
}

apply plugin: "com.facebook.react.rootproject"

// --- Fix: `./gradlew clean` breaking the New Architecture CMake build ---
//
// Root cause: android/app/build/generated/autolinking/src/main/jni/Android-autolinking.cmake
// (regenerated by the RN gradle plugin) add_subdirectory()'s into several autolinked
// libraries' generated codegen output, e.g.
//   node_modules/@op-engineering/op-sqlite/android/build/generated/source/codegen/jni/
//   node_modules/react-native-share/android/build/generated/source/codegen/jni/
//   node_modules/react-native-nitro-google-signin/android/build/generated/source/codegen/jni/
// Those paths live inside each library's own Gradle build directory, which that
// library's own (autolinking-generated) `clean` task wipes wholesale.
//
// `./gradlew clean` at the root runs the `clean` task on every subproject, and
// :app's own `clean` transitively runs `:app:externalNativeBuildClean<Variant>`,
// which has to re-run CMake's *configure* step to know what to delete — reading
// the same add_subdirectory() paths above. Gradle has no inherent ordering between
// independent subprojects' `clean` tasks, so a library's `clean` can (and, on this
// project, reliably does) delete its codegen/jni directory before :app's native
// clean has configured CMake, so add_subdirectory() fails with "directory does not
// exist" — a chicken-and-egg bug between RN's CMake-based clean and codegen output
// that lives inside node_modules.
//
// Fix: force :app's native clean tasks to run before every other subproject's
// `clean`, so CMake always configures while the codegen sources still exist. The
// libraries' build dirs (and their codegen output) are then safely wiped afterwards
// — a normal build regenerates them via the codegen task, same as it always has.
gradle.projectsEvaluated {
    def appProject = project(':app')
    def appNativeCleanTasks = appProject.tasks.matching { it.name.startsWith('externalNativeBuildClean') }
    subprojects.each { sub ->
        if (sub.path == ':app') return
        sub.tasks.matching { it.name == 'clean' }.configureEach { t ->
            t.mustRunAfter(appNativeCleanTasks)
        }
    }
}
