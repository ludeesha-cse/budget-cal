# Gitignored (see .gitignore) — temporary, to be replaced in a later commit.
services:
  postgres:
    image: postgres:14
    container_name: budget-calculator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget_calculator
      POSTGRES_PASSWORD: budget_calculator
      # Postgres image auto-creates this database on first start.
      POSTGRES_DB: budget_calculator_dev
    ports:
      # 5433, not 5432 — another Postgres instance on this machine already uses 5432.
      - '5433:5432'
    volumes:
      # Named volume — seeded data survives restarts unless removed with `-v`.
      - budget-calculator-postgres-data:/var/lib/postgresql/data

volumes:
  budget-calculator-postgres-data:
